<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menükarte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Source+Serif+4:wght@400;600&family=Dancing+Script:wght@600&display=swap">
<style>
:root{--bg:#efe9d8;--ink:#2a3220;--mut:#5f6650;--ol:#2f4a1c;--ol2:#6f7d3f;--ln:#c9c3b0;--card:#e8e1cc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181e13;--ink:#ebe5d2;--mut:#a3aa8f;--ol:#b8cf88;--ol2:#8fa05a;--ln:#38422d;--card:#202818}}
:root[data-theme="dark"]{--bg:#181e13;--ink:#ebe5d2;--mut:#a3aa8f;--ol:#b8cf88;--ol2:#8fa05a;--ln:#38422d;--card:#202818}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Source Serif 4",Georgia,serif}
main{max-width:640px;margin:0 auto;padding:0 20px 56px;position:relative}
header{text-align:center;padding:44px 0 18px;position:relative}
.corner{position:absolute;left:-26px;top:-6px;width:170px;height:64px;color:var(--ol2);transform:rotate(18deg);opacity:.9}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:800;color:var(--ol);letter-spacing:.06em;text-transform:uppercase;margin:0;text-align:center}
h1{font-size:2.3rem;line-height:1.1}
header p{margin:8px 0 0;color:var(--mut);font-style:italic}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);margin:0 -20px;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;color:var(--ol);text-decoration:none;font-weight:600;font-size:.9rem;padding:6px 13px;border:1px solid var(--ln);border-radius:20px}
nav a.on{background:var(--ol);color:var(--bg);border-color:var(--ol)}
nav a:focus-visible{outline:2px solid var(--ol);outline-offset:2px}
section{padding-top:34px}
h2{font-size:1.6rem;letter-spacing:.08em}
.rule{display:flex;align-items:center;gap:10px;margin:8px 0 12px;color:var(--ol2)}
.rule:before,.rule:after{content:"";flex:1;height:1px;background:var(--ol);opacity:.55}
.rule svg{width:54px;height:20px}
.note{text-align:center;color:var(--mut);margin:0 0 6px;font-size:.95rem}
.it{display:grid;grid-template-columns:1fr auto 3.6rem;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--ln)}
.it b{font-weight:400;font-size:1.05rem;display:block}
.it small{display:block;color:var(--mut);font-size:.82rem;line-height:1.35;margin-top:2px}
.m{color:var(--mut);font-size:.88rem;white-space:nowrap}
.p{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.deal{margin-top:30px;background:var(--card);border-radius:6px;padding:20px 18px;display:flex;align-items:center;gap:16px;border:1px solid var(--ln)}
.deal h3{margin:0;font:600 2.1rem/1 "Dancing Script",cursive;color:var(--ol)}
.deal p{margin:6px 0 0;color:var(--mut)}
.badge{flex:none;width:92px;height:92px;border-radius:50%;background:var(--ol);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:1.5rem;line-height:1}
.badge span{font:600 .75rem "Source Serif 4",Georgia,serif;margin-top:4px;letter-spacing:.1em}
footer{text-align:center;color:var(--ol2);padding-top:40px}
footer svg{width:70px;height:26px}
footer p{margin:6px 0 0;font-size:.8rem;color:var(--mut)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="ol" viewBox="0 0 80 30"><path d="M3 23C25 21 50 15 77 8" fill="none" stroke="currentColor" stroke-width="1.3"/><g fill="currentColor"><ellipse cx="18" cy="15" rx="9" ry="3" transform="rotate(-30 18 15)"/><ellipse cx="32" cy="26" rx="9" ry="3" transform="rotate(25 32 26)"/><ellipse cx="47" cy="9" rx="9" ry="3" transform="rotate(-25 47 9)"/><ellipse cx="60" cy="20" rx="8" ry="2.8" transform="rotate(20 60 20)"/><ellipse cx="72" cy="4" rx="7" ry="2.5" transform="rotate(-20 72 4)"/></g><ellipse cx="41" cy="21" rx="3.4" ry="4.6" fill="var(--ol)"/><ellipse cx="54" cy="14" rx="3.2" ry="4.4" fill="var(--ol)"/></symbol></svg>

const A=document.getElementById("app"),N=document.getElementById("nav");
A.innerHTML=S.map(([id,t,n,l])=>`<section id="${id}"><h2>${t}</h2><div class="rule"><svg aria-hidden="true"><use href="#ol"/></svg></div>${n?`<p class="note">${n}</p>`:""}${l.split("\n").map(r=>{const[a,b,c,d]=r.split("|");return `<div class="it"><div><b>${a}</b>${b?`<small>${b}</small>`:""}</div><span class="m">${c||""}</span><span class="p">${d}</span></div>`}).join("")}</section>`).join("");
N.innerHTML=S.map(([id,t])=>`<a href="#${id}">${t.replace("Für unsere kleinen Gäste","Kinder").replace("Erfrischende ","")}</a>`).join("");
const L=[...N.children];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){L.forEach(a=>a.classList.toggle("on",a.hash==="#"+e.target.id));const a=N.querySelector(".on");if(a)N.scrollTo({left:a.offsetLeft-20,behavior:"smooth"})}}),{rootMargin:"-30% 0px -65% 0px"});
S.forEach(([id])=>io.observe(document.getElementById(id)));

</body>
</html>
